; PlatformIO project file for CarCYD.
;
; The firmware needs the ESP32 Arduino core 3.x (ledcAttachChannel / ledcWriteTone
; with a pin argument), so this uses the pioarduino fork of the Espressif32
; platform instead of the official PlatformIO one, which is still on core 2.0.x.
;
; Pick the environment that matches your board:
;
;   pio run -e cyd_ili9341_2 -t upload    ; micro-USB + USB-C "CYD2USB", ILI9341  <- default
;   pio run -e cyd_ili9341   -t upload    ; original single micro-USB board
;   pio run -e cyd_st7789    -t upload    ; 2-USB board fitted with an ST7789
;
; Flash size is the stock 4 MB with the default partition table, same as the
; Arduino IDE "ESP32 Dev Module" target used by CI.

[platformio]
src_dir = CarCYD
default_envs = cyd_ili9341_2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
board_build.partitions = partitions.csv
lib_deps =
    lvgl/lvgl@9.6.0
    lovyan03/LovyanGFX@^1.2.0
; The Home Assistant upload is disabled in app_config.h (APP_ENABLE_HA 0); keep
; its sources out of the build as well so no WiFi code is ever linked.
build_src_filter =
    +<*>
    -<src/core/ha_export.cpp>
    -<src/hal/ha_http.cpp>
build_flags =
    -Os
    ; lv_conf.h lives in the sketch folder and reaches LVGL through the
    ; project include path (see CarCYD/lv_conf.h).
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I CarCYD
    -Wall

; ---- Panel variants --------------------------------------------------------------
; CYD_PANEL_INVERT is set per panel: the ILI9341_2 init sequence clears the GS bit,
; which mirrors the picture, so only that variant needs the extra inversion.
; See docs/hardware.md#display-variants.

[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DCYD_PANEL=1
    -DCYD_PANEL_INVERT=0

[env:cyd_ili9341_2]
build_flags =
    ${env.build_flags}
    -DCYD_PANEL=2
    -DCYD_PANEL_INVERT=1

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DCYD_PANEL=3
    -DCYD_PANEL_INVERT=0
